# Netlify configuration for the Stride Log PWA (Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for all client-side routes.
# Existing files (assets, sw.js, icons, manifest) are served first, so this
# does not shadow the PWA files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached upstream, or updates would lag a
# build behind.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest and hashed build assets can be cached hard.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
